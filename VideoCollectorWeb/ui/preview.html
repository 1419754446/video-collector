<script>
(function () {
  try {
    var t = new URLSearchParams(location.search).get('theme') || 'dark';
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="preview.css">
</head>
<body>
<div class="player" id="player">
  <video id="video" playsinline preload="metadata"></video>

  <header class="topbar" id="topbar">
    <div class="file">
      <span class="live-dot"></span>
      <div class="txt">
        <div class="name" id="fileName">视频预览</div>
        <div class="sub" id="fileSub"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="chip-btn" id="btnOpen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="3"></rect><path d="M10 9.5v5l4.2-2.5z" fill="currentColor" stroke="none"></path></svg>
        <span>系统播放器</span>
      </button>
      <button class="chip-btn" id="btnReveal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg>
        <span>所在文件夹</span>
      </button>
      <button class="chip-btn danger" id="btnClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"></path></svg>
        <span>关闭</span>
      </button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <button class="center-play" id="centerPlay" aria-label="播放">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6l11-6.8z"></path></svg>
    </button>

    <div class="error" id="error" hidden>
      <div class="error-icon">!</div>
      <div class="error-title">内置播放器无法播放</div>
      <div class="error-sub">该视频的封装格式或编码可能不受支持，请使用系统播放器打开。</div>
      <button class="chip-btn" id="errOpen">用系统播放器打开</button>
    </div>

    <div class="loading" id="loading">
      <span class="ring"></span>
      <span>正在加载…</span>
    </div>
  </div>

  <footer class="controls" id="controls">
    <div class="seek" id="seek">
      <div class="seek-buffer" id="seekBuffer"></div>
      <div class="seek-played" id="seekPlayed"><i></i></div>
    </div>
    <div class="bar">
      <button class="icon" id="btnPlay" title="播放/暂停（空格）">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6l11-6.8z"></path></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="7" y="5" width="3.4" height="14" rx="1.2"></rect><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"></rect></svg>
      </button>
      <span class="time" id="time">00:00 / 00:00</span>
      <div class="path" id="path" title="点击复制完整路径"></div>
      <div class="spacer"></div>
      <button class="icon" id="btnMute" title="静音（M）">
        <svg id="iconVolume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"></path><path d="M15 9a4.5 4.5 0 0 1 0 6"></path><path d="M17.6 6.6a8 8 0 0 1 0 10.8"></path></svg>
        <svg id="iconMuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"></path><path d="M15.5 9.2l4.6 5.6M20.1 9.2l-4.6 5.6" stroke-linecap="round"></path></svg>
      </button>
      <input class="volume" id="volume" type="range" min="0" max="1" step="0.02" value="1">
      <select class="rate" id="rate" title="播放速度">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button class="icon" id="btnFull" title="全屏（F）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round"></path></svg>
      </button>
    </div>
  </footer>
</div>
<script src="preview.js"></script>
</body>
</html>
